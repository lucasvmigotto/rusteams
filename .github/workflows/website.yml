name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - Cargo.toml
      - .github/workflows/website.yml
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify TypeScript 7
        run: |
          bunx tsc --version | grep -q "Version 7" || { echo "::error::TypeScript 7.x required"; exit 1; }
          bun pm ls typescript

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Set version
        id: version
        run: |
          VERSION=$(bun -e "const m = require('fs').readFileSync('../Cargo.toml','utf8').match(/^version\s*=\s*\"([^\"]+)\"/m); console.log(m[1])")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusteams-website-${{ steps.version.outputs.VERSION }}
          path: |
            website/dist/
          retention-days: 7
          if-no-files-found: error

  cd:
    name: CD (deploy to Cloudflare R2)
    runs-on: ubuntu-24.04
    needs: [ci]
    permissions:
      contents: read

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: rusteams-website-${{ needs.ci.outputs.version }}
          path: dist

      - name: Validate R2 endpoint
        run: |
          ENDPOINT="${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}"
          if [ -z "$ENDPOINT" ]; then
            echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT repo variable is not set"
            exit 1
          fi
          case "$ENDPOINT" in
            https://*) echo "R2 endpoint OK: $ENDPOINT" ;;
            *) echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT must start with https:// (got: $ENDPOINT)"; exit 1 ;;
          esac

      - name: Ensure AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq awscli
          fi
          aws --version

      - name: Sync static site to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_SECRET }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          ENDPOINT="${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}"
          BUCKET="${{ vars.CLOUDFLARE_R2_BUCKET_ID }}"
          aws s3 sync dist/ "s3://${BUCKET}" \
            --endpoint-url "${ENDPOINT}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --endpoint-url "${ENDPOINT}" \
            --cache-control "no-cache" \
            --content-type "text/html"
