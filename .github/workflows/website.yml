name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - Cargo.toml
      - .github/workflows/website.yml
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/site
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify TypeScript 7
        run: |
          bunx tsc --version | grep -q "Version 7" || { echo "::error::TypeScript 7.x required"; exit 1; }
          bun pm ls typescript

      - name: Validate site URL
        env:
          # Derived from the repo name: https://docs.lucasvmigotto.me/<repo>.
          SITE_URL: https://docs.lucasvmigotto.me/${{ github.event.repository.name }}
        run: |
          case "$SITE_URL" in
            https://*) ;;
            *) echo "::error::site URL must start with https:// (got: $SITE_URL)"; exit 1 ;;
          esac
          echo "Site URL OK: $SITE_URL"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        env:
          VITE_APP_SITE_NAME: https://docs.lucasvmigotto.me/${{ github.event.repository.name }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      # Crawlers need absolute OG URLs: fail if the build left a placeholder
      # (Vite leaves %VITE_*% literal when the variable is undefined).
      - name: Assert absolute OG tags
        run: |
          test -f dist/og-image.png
          if grep -q '%VITE_' dist/index.html; then
            echo "::error::dist/index.html still contains an unresolved Vite env placeholder"; exit 1
          fi
          flat=$(tr -d '\n' < dist/index.html | tr -s ' ')
          echo "$flat" | grep -q 'property="og:image" content="https://[^"]*/og-image.png"' \
            || { echo "::error::og:image is not an absolute https:// URL"; exit 1; }
          echo "$flat" | grep -q 'name="twitter:image" content="https://[^"]*/og-image.png"' \
            || { echo "::error::twitter:image is not an absolute https:// URL"; exit 1; }
          echo "$flat" | grep -q 'property="og:url" content="https://[^"]*"' \
            || { echo "::error::og:url is not an absolute https:// URL"; exit 1; }

      - name: Guard prefix-scoped R2 deploy
        run: |
          # Fitness function (ADR 0001 in lucas/docs): every R2 sync/cp must be
          # prefix-scoped, so a project can never wipe the shared bucket root.
          bad=$(grep -nE '^[[:space:]]+aws s3 (sync|cp)' .github/workflows/website.yml | grep -v 'R2_PREFIX' || true)
          if [ -n "$bad" ]; then
            echo "::error::root-scoped R2 target detected — every deploy must use \$R2_PREFIX"
            echo "$bad"
            exit 1
          fi

      - name: Set version
        id: version
        run: |
          VERSION=$(bun -e "const m = require('fs').readFileSync('../../Cargo.toml','utf8').match(/^version\s*=\s*\"([^\"]+)\"/m); console.log(m[1])")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: rusteams-website-${{ steps.version.outputs.VERSION }}
          path: |
            docs/site/dist/
          retention-days: 7
          if-no-files-found: error

  cd:
    name: CD (deploy to Cloudflare R2)
    runs-on: ubuntu-24.04
    needs: [ci]
    permissions:
      contents: read
    environment:
      name: rusteams-docs
      url: https://docs.lucasvmigotto.me/rusteams/
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_SECRET }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}
      R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET_ID }}
      # Per-project prefix in the shared docs-hub bucket (ADR 0001). The slug
      # is the repository name — no per-repo configuration, cannot drift.
      R2_PREFIX: /${{ github.event.repository.name }}/

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: rusteams-website-${{ needs.ci.outputs.version }}
          path: dist

      - name: Validate R2 configuration
        run: |
          missing=0
          for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          case "$R2_ENDPOINT" in
            https://*) echo "R2 endpoint OK" ;;
            *) echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT must start with https:// (got: $R2_ENDPOINT)"; exit 1 ;;
          esac
          case "$R2_PREFIX" in
            /*/) ;;
            *) echo "::error::R2_PREFIX must look like /<slug>/ (got: '$R2_PREFIX')"; exit 1 ;;
          esac

      - name: Ensure AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq awscli
          fi
          aws --version

      - name: Sync static site to docs-hub prefix
        run: |
          # Prefix-scoped deploy into the shared docs-hub bucket (ADR 0001).
          # NEVER sync with --delete on the bucket root — that would wipe
          # the other apps' prefixes and the landing.
          aws s3 sync dist/ "s3://${R2_BUCKET}${R2_PREFIX}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${R2_BUCKET}${R2_PREFIX}index.html" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "no-cache" \
            --content-type "text/html"
