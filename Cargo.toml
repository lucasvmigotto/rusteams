[package]
name = "rusteams"
version = "0.1.0"
edition = "2024"
description = "Terminal user interface (TUI) client for Microsoft Teams via Microsoft Graph (MVP: real-time chat)"
license = "GPL-3.0-or-later"
repository = "https://github.com/lucasvmigotto/rusteams"
keywords = ["teams", "tui", "microsoft-graph", "chat", "ratatui"]
categories = ["command-line-utilities"]
rust-version = "1.89.0"

[[bin]]
name = "rusteams"
path = "src/main.rs"

[lib]
name = "rusteams"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
keyring = "3"
chrono = { version = "0.4", features = ["serde", "clock"] }
url = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
pretty_assertions = "1"
tempfile = "3"
