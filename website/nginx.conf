# rusteams website nginx config (adapted from site-isa).
#
# Differences from the reference: hash-based routing keeps every route in
# the URL fragment, so the server only serves /index.html — no per-route
# HTML files, no SPA fallback rewrites.

worker_processes auto;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # NOTE: any location block with its own add_header directives
        # stops inheriting the server-level security headers, so they are
        # repeated here explicitly.
        location /assets/ {
          expires 1y;
          add_header Cache-Control "public, immutable";
          add_header X-Frame-Options DENY always;
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # Entry HTML, favicon, OG image: content updates go live immediately.
        location / {
          try_files $uri $uri/ =404;
          add_header Cache-Control "no-cache";
          add_header X-Frame-Options DENY always;
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

    }
}
