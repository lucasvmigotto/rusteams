worker_processes auto;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log  /dev/stderr warn;

    sendfile        on;
    keepalive_timeout  65;

    # All three mocks share one pod (localhost), so nginx never depends on
    # container DNS: upstream IPs cached at startup can't go stale.
    upstream entra_mock {
        server entra-mock:8080;
    }

    upstream graph_mock {
        server graph-mock:3000;
    }

    # Mock Entra (devicecode + token). TLS required: MS SSO flows are
    # HTTPS-only, so nginx terminates the self-signed sim CA here.
    # Port-routed (not SNI): localhost resolves with no host changes.
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;

        location / {
            proxy_pass http://entra_mock;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Mock Graph (Scalar mock-server, OpenAPI-driven). Separate port so
    # both mocks share the localhost certificate with no host changes.
    server {
        listen 8444 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;

        location / {
            proxy_pass http://graph_mock;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
